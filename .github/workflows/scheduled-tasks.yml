name: Scheduled Tasks

on:
  workflow_dispatch:

  schedule:
    - cron: '30 2 * * 1'
    - cron: '0 */6 * * *'

jobs:
  scheduled-job:
    runs-on: ubuntu-latest
    steps:
      - name: Print Trigger
        run: |
          echo "Triggered by Schedule:"
          echo "${{ github.event.schedule }}"

      - name: Health Check
        run: |
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" https://example.com)
          echo "Response code: $STATUS"

          if [ "$STATUS" != "200" ]; then
            exit 1
          fi
